name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      api-url:
        required: true
        type: string
      s3-bucket:
        required: true
        type: string
      cloudfront-id:
        required: true
        type: string
  push:
    branches: [main, test, dev]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

env:
  AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Determine environment and API URL
      id: config
      run: |
        if [[ "${{ inputs.environment }}" != "" ]]; then
          echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          echo "api-url=${{ inputs.api-url }}" >> $GITHUB_OUTPUT
          echo "s3-bucket=${{ inputs.s3-bucket }}" >> $GITHUB_OUTPUT
          echo "cloudfront-id=${{ inputs.cloudfront-id }}" >> $GITHUB_OUTPUT
        else
          # Get from Terraform when running standalone
          cd infrastructure
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
            ENV="test"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "api-url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
          echo "s3-bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront-id=$(terraform output -raw cloudfront_frontend_id)" >> $GITHUB_OUTPUT
        fi
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Build React app
      working-directory: ./frontend
      env:
        VITE_API_URL: ${{ steps.config.outputs.api-url }}
        VITE_ENVIRONMENT: ${{ steps.config.outputs.environment }}
      run: npm run build
    
    - name: Deploy to S3
      working-directory: ./frontend
      run: |
        aws s3 sync dist/ s3://${{ steps.config.outputs.s3-bucket }} --delete
    
    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ steps.config.outputs.cloudfront-id }} \
          --paths "/*"