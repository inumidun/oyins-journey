name: Deploy Full Stack

on:
  push:
    branches: [main, test, dev]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      api-url: ${{ steps.tf-output.outputs.api-url }}
      s3-bucket: ${{ steps.tf-output.outputs.s3-bucket }}
      cloudfront-id: ${{ steps.tf-output.outputs.cloudfront-id }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false
    
    - name: Determine environment
      id: env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
          echo "environment=test" >> $GITHUB_OUTPUT
        else
          echo "environment=dev" >> $GITHUB_OUTPUT
        fi
    
    - name: Terraform Init
      working-directory: ./infrastructure
      run: terraform init
    
    - name: Terraform Plan
      working-directory: ./infrastructure
      run: |
        terraform plan -var="environment=${{ steps.env.outputs.environment }}" \
                      -var-file="config/${{ steps.env.outputs.environment }}.tfvars"
    
    - name: Terraform Apply
      if: github.event_name == 'push'
      working-directory: ./infrastructure
      run: |
        terraform apply -auto-approve \
                       -var="environment=${{ steps.env.outputs.environment }}" \
                       -var-file="config/${{ steps.env.outputs.environment }}.tfvars"
    
    - name: Get Terraform Outputs
      if: github.event_name == 'push'
      id: tf-output
      working-directory: ./infrastructure
      run: |
        echo "api-url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
        echo "s3-bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
        echo "cloudfront-id=$(terraform output -raw cloudfront_frontend_id)" >> $GITHUB_OUTPUT

  deploy-frontend:
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Build React app
      working-directory: ./frontend
      env:
        VITE_API_URL: ${{ needs.deploy-infrastructure.outputs.api-url }}
        VITE_ENVIRONMENT: ${{ github.ref_name }}
      run: npm run build
    
    - name: Deploy to S3
      working-directory: ./frontend
      run: |
        aws s3 sync dist/ s3://${{ needs.deploy-infrastructure.outputs.s3-bucket }} --delete
    
    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront-id }} \
          --paths "/*"