name: Web Application Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      api_url:
        required: true
        type: string
      frontend_bucket:
        required: true
        type: string
      admin_bucket:
        required: true
        type: string
      cloudfront_frontend_id:
        required: true
        type: string
      cloudfront_admin_id:
        required: true
        type: string

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.aws-region }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Build React app
      working-directory: ./frontend
      env:
        VITE_API_URL: ${{ inputs.api_url }}
        VITE_ENVIRONMENT: ${{ inputs.environment }}
      run: npm run build
    
    - name: Deploy to S3
      run: |
        aws s3 sync frontend/dist/ s3://${{ inputs.frontend_bucket }} --delete
        aws s3 sync admin/ s3://${{ inputs.admin_bucket }} --delete
    
    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ inputs.cloudfront_frontend_id }} --paths "/*"
        aws cloudfront create-invalidation --distribution-id ${{ inputs.cloudfront_admin_id }} --paths "/*"