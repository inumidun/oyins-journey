name: Web Application Deployment

on:
  workflow_call:

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Package Lambda functions
      run: |
        cd api
        zip -r skills.zip skills.py
        zip -r projects.zip projects.py
        zip -r certifications.zip certifications.py
        zip -r adrs.zip adrs.py
        zip -r version.zip version.py
        zip -r admin.zip admin.py
    
    - name: Deploy Lambda functions
      run: |
        echo "Lambda deployment would happen here"
        # AWS CLI commands to update Lambda functions
  
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-lambda]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Get infrastructure outputs
      id: infra
      run: |
        cd infrastructure
        echo "frontend_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
        echo "admin_bucket=$(terraform output -raw s3_admin_bucket_name)" >> $GITHUB_OUTPUT
    
    - name: Deploy to S3
      run: |
        aws s3 sync frontend/ s3://${{ steps.infra.outputs.frontend_bucket }} --delete
        aws s3 sync admin/ s3://${{ steps.infra.outputs.admin_bucket }} --delete
    
    - name: Invalidate CloudFront
      run: |
        # Get CloudFront distribution IDs and invalidate cache
        echo "CloudFront invalidation would happen here"