name: Web Application Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: "us-east-1"

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ inputs.aws_region }}
      PROJECT_NAME: oyins-journey

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure values from SSM
        run: |
          API_URL=$(aws ssm get-parameter --name "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-api-url" --region ${{ env.AWS_REGION }} --query "Parameter.Value" --output text)
          S3_BUCKET=$(aws ssm get-parameter --name "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-s3-bucket" --region ${{ env.AWS_REGION }} --query "Parameter.Value" --output text)
          S3_ADMIN_BUCKET=$(aws ssm get-parameter --name "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-s3-admin-bucket" --region ${{ env.AWS_REGION }} --query "Parameter.Value" --output text)
          CLOUDFRONT_FRONTEND_ID=$(aws ssm get-parameter --name "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cloudfront-frontend-id" --region ${{ env.AWS_REGION }} --query "Parameter.Value" --output text)
          CLOUDFRONT_ADMIN_ID=$(aws ssm get-parameter --name "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cloudfront-admin-id" --region ${{ env.AWS_REGION }} --query "Parameter.Value" --output text)
          
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV
          echo "S3_ADMIN_BUCKET=$S3_ADMIN_BUCKET" >> $GITHUB_ENV
          echo "CLOUDFRONT_FRONTEND_ID=$CLOUDFRONT_FRONTEND_ID" >> $GITHUB_ENV
          echo "CLOUDFRONT_ADMIN_ID=$CLOUDFRONT_ADMIN_ID" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build React app
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }} --delete
          aws s3 sync admin/ s3://${{ env.S3_ADMIN_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_FRONTEND_ID }} --paths "/*"
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_ADMIN_ID }} --paths "/*"
