name: Web Application Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Package Lambda functions
      run: |
        cd api
        # Create zip files for each Lambda function
        zip skills.zip skills.py
        zip projects.zip projects.py
        zip certifications.zip certifications.py
        zip adrs.zip adrs.py
        zip version.zip version.py
        zip admin.zip admin.py
        
        # Move zip files to infrastructure directory for Terraform
        mv *.zip ../infrastructure/
    
    - name: Deploy Lambda functions
      run: |
        echo "Lambda deployment would happen here"
        # AWS CLI commands to update Lambda functions
  
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-lambda]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.aws_region }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
        terraform_wrapper: false
    
    - name: Get infrastructure outputs
      id: infra
      run: |
        cd infrastructure
        terraform init -backend-config="key=infrastructure/${{ inputs.environment }}/terraform.tfstate"
        
        # Get outputs from remote state
        echo "frontend_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
        echo "admin_bucket=$(terraform output -raw s3_admin_bucket_name)" >> $GITHUB_OUTPUT
        echo "cloudfront_frontend_id=$(terraform output -raw cloudfront_frontend_id)" >> $GITHUB_OUTPUT
        echo "cloudfront_admin_id=$(terraform output -raw cloudfront_admin_id)" >> $GITHUB_OUTPUT
    
    - name: Deploy to S3
      run: |
        aws s3 sync frontend/ s3://${{ steps.infra.outputs.frontend_bucket }} --delete
        aws s3 sync admin/ s3://${{ steps.infra.outputs.admin_bucket }} --delete
    
    - name: Invalidate CloudFront
      run: |
        # Invalidate CloudFront distributions
        aws cloudfront create-invalidation --distribution-id ${{ steps.infra.outputs.cloudfront_frontend_id }} --paths "/*"
        aws cloudfront create-invalidation --distribution-id ${{ steps.infra.outputs.cloudfront_admin_id }} --paths "/*"