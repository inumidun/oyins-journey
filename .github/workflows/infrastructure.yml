name: Infrastructure Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    outputs:
      s3-frontend-bucket: ${{ steps.terraform.outputs.s3_bucket_name }}
      s3-admin-bucket: ${{ steps.terraform.outputs.s3_admin_bucket_name }}
      cloudfront-frontend-url: ${{ steps.terraform.outputs.cloudfront_frontend_url }}
      cloudfront-admin-url: ${{ steps.terraform.outputs.cloudfront_admin_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.aws_region }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
        terraform_wrapper: false
    
    - name: Terraform Init
      working-directory: ./infrastructure
      run: |
        terraform init
        if [ "${{ inputs.environment }}" != "prod" ]; then
          terraform workspace select ${{ inputs.environment }} 2>/dev/null || terraform workspace new ${{ inputs.environment }}
        fi
    
    - name: Terraform Security Scan
      working-directory: ./infrastructure
      run: |
        echo "🔍 Running Terraform security scan..."
        # Add tools like tfsec, checkov, or terraform validate
        terraform validate
    
    - name: Terraform Plan
      working-directory: ./infrastructure
      run: |
        terraform plan -var-file="config/${{ inputs.environment }}.tfvars" -out=tfplan
        terraform show -json tfplan > plan.json
    
    - name: Check if resources need to be created
      id: check-resources
      working-directory: ./infrastructure
      run: |
        # Check if plan shows resources to create
        RESOURCES_TO_CREATE=$(terraform show -json tfplan | jq '.resource_changes[] | select(.change.actions[] == "create") | .address' | wc -l)
        echo "Resources to create: $RESOURCES_TO_CREATE"
        if [ "$RESOURCES_TO_CREATE" -gt 0 ]; then
          echo "apply_needed=true" >> $GITHUB_OUTPUT
        else
          echo "apply_needed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Terraform Apply
      if: steps.check-resources.outputs.apply_needed == 'true'
      id: terraform-apply
      working-directory: ./infrastructure
      run: |
        terraform apply -auto-approve tfplan
        echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
        echo "s3_admin_bucket_name=$(terraform output -raw s3_admin_bucket_name)" >> $GITHUB_OUTPUT
        echo "cloudfront_frontend_url=$(terraform output -raw cloudfront_frontend_url)" >> $GITHUB_OUTPUT
        echo "cloudfront_admin_url=$(terraform output -raw cloudfront_admin_url)" >> $GITHUB_OUTPUT
    
    - name: Get existing outputs (if no apply needed)
      if: steps.check-resources.outputs.apply_needed == 'false'
      id: terraform-outputs
      working-directory: ./infrastructure
      run: |
        echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
        echo "s3_admin_bucket_name=$(terraform output -raw s3_admin_bucket_name)" >> $GITHUB_OUTPUT
        echo "cloudfront_frontend_url=$(terraform output -raw cloudfront_frontend_url)" >> $GITHUB_OUTPUT
        echo "cloudfront_admin_url=$(terraform output -raw cloudfront_admin_url)" >> $GITHUB_OUTPUT
    
    - name: Set final outputs
      id: terraform
      run: |
        if [ "${{ steps.check-resources.outputs.apply_needed }}" == "true" ]; then
          echo "s3_bucket_name=${{ steps.terraform-apply.outputs.s3_bucket_name }}" >> $GITHUB_OUTPUT
          echo "s3_admin_bucket_name=${{ steps.terraform-apply.outputs.s3_admin_bucket_name }}" >> $GITHUB_OUTPUT
          echo "cloudfront_frontend_url=${{ steps.terraform-apply.outputs.cloudfront_frontend_url }}" >> $GITHUB_OUTPUT
          echo "cloudfront_admin_url=${{ steps.terraform-apply.outputs.cloudfront_admin_url }}" >> $GITHUB_OUTPUT
        else
          echo "s3_bucket_name=${{ steps.terraform-outputs.outputs.s3_bucket_name }}" >> $GITHUB_OUTPUT
          echo "s3_admin_bucket_name=${{ steps.terraform-outputs.outputs.s3_admin_bucket_name }}" >> $GITHUB_OUTPUT
          echo "cloudfront_frontend_url=${{ steps.terraform-outputs.outputs.cloudfront_frontend_url }}" >> $GITHUB_OUTPUT
          echo "cloudfront_admin_url=${{ steps.terraform-outputs.outputs.cloudfront_admin_url }}" >> $GITHUB_OUTPUT
        fi
    
    - name: Post-deployment validation
      run: |
        echo "✅ Validating ${{ inputs.environment }} infrastructure deployment..."
        # Add infrastructure validation tests