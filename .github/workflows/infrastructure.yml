name: Infrastructure Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: oyins-journey
    
    outputs:
      s3-frontend-bucket: ${{ steps.terraform-apply.outputs.s3_bucket_name }}
      s3-admin-bucket: ${{ steps.terraform-apply.outputs.s3_admin_bucket_name }}
      cloudfront-frontend-url: ${{ steps.terraform-apply.outputs.cloudfront_frontend_url }}
      cloudfront-admin-url: ${{ steps.terraform-apply.outputs.cloudfront_admin_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.aws_region }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
        terraform_wrapper: false
    
    - name: Bootstrap backend (if needed)
      working-directory: ./infrastructure
      run: |
        aws s3api head-bucket --bucket oyins-journey-terraform-state >/dev/null 2>&1 || {
          echo "🚀 Creating Terraform backend..."
          chmod +x bootstrap.sh
          ./bootstrap.sh
        }
    
    - name: Clear Known Stale Lock
      working-directory: ./infrastructure
      run: |
        echo "🔧 Clearing known stale lock before terraform operations..."
        
        # Clear the specific problematic lock ID directly
        KNOWN_LOCK_ID="95e59694-ed04-163e-b715-c11551303d08"
        LOCK_TABLE="oyins-journey-terraform-locks"
        STATE_PATH="oyins-journey-terraform-state/infrastructure/dev/terraform.tfstate"
        
        echo "Attempting to clear lock ID: $KNOWN_LOCK_ID"
        
        # Method 1: Nuclear option - delete all items in lock table (safe since it's just locks)
        echo "🧹 Clearing all locks in table..."
        aws dynamodb scan \
          --table-name "$LOCK_TABLE" \
          --region us-east-1 \
          --query 'Items[].LockID.S' \
          --output text | tr '\t' '\n' | while read -r lock_id; do
            if [ -n "$lock_id" ] && [ "$lock_id" != "None" ] && [ "$lock_id" != "null" ]; then
              echo "Deleting lock: $lock_id"
              aws dynamodb delete-item \
                --table-name "$LOCK_TABLE" \
                --key "{\"LockID\":{\"S\":\"$lock_id\"}}" \
                --region us-east-1 || echo "Failed to delete $lock_id"
            fi
          done
        
        # Method 2: Try terraform force-unlock (may fail if backend not initialized)
        echo "🔓 Attempting terraform force-unlock..."
        terraform init -backend-config="key=infrastructure/dev/terraform.tfstate" 2>/dev/null || echo "Init failed, continuing..."
        terraform force-unlock -force "$KNOWN_LOCK_ID" 2>/dev/null || echo "Terraform force-unlock failed"
        
        echo "✅ Lock clearing attempts completed"

    - name: Terraform Init
      working-directory: ./infrastructure
      run: |
        ENV="${{ inputs.environment }}"
        
        # Handle backend configuration changes gracefully
        echo "🔧 Initializing Terraform with backend configuration..."
        
        # Try normal init first
        if ! terraform init -backend-config="key=infrastructure/${ENV}/terraform.tfstate"; then
          echo "⚠️ Normal init failed, attempting reconfigure..."
          terraform init -reconfigure -backend-config="key=infrastructure/${ENV}/terraform.tfstate"
        fi
        
        echo "✅ Terraform initialization completed"
    
    - name: Terraform Plan
      working-directory: ./infrastructure
      run: |
        ENV="${{ inputs.environment }}"
        
        # Simple retry logic with better lock clearing
        for attempt in 1 2 3; do
          echo "🔄 Terraform plan attempt $attempt of 3"
          
          if terraform plan -var-file="config/${ENV}.tfvars" -out=tfplan; then
            echo "✅ Terraform plan succeeded"
            break
          else
            if [ $attempt -eq 3 ]; then
              echo "❌ All terraform plan attempts failed"
              exit 1
            fi
            
            echo "🔧 Plan failed, clearing locks and retrying..."
            
            # Clear locks using multiple methods
            LOCK_TABLE="oyins-journey-terraform-locks"
            
            # Method 1: Clear all locks in the table (safe operation)
            aws dynamodb scan --table-name "$LOCK_TABLE" --region us-east-1 --query 'Items[].LockID.S' --output text | tr '\t' '\n' | while read -r lock_id; do
              if [ -n "$lock_id" ] && [ "$lock_id" != "None" ]; then
                aws dynamodb delete-item --table-name "$LOCK_TABLE" --key "{\"LockID\":{\"S\":\"$lock_id\"}}" --region us-east-1 2>/dev/null || true
              fi
            done
            
            # Method 2: Force unlock known problematic ID
            terraform force-unlock -force "95e59694-ed04-163e-b715-c11551303d08" 2>/dev/null || true
            
            echo "⏳ Waiting 10 seconds before retry..."
            sleep 10
          fi
        done
    
    - name: Terraform Apply
      id: terraform-apply
      working-directory: ./infrastructure
      run: |
        # Simple retry logic with better lock clearing
        for attempt in 1 2 3; do
          echo "🔄 Terraform apply attempt $attempt of 3"
          
          if terraform apply -auto-approve tfplan; then
            echo "✅ Terraform apply succeeded"
            break
          else
            if [ $attempt -eq 3 ]; then
              echo "❌ All terraform apply attempts failed"
              exit 1
            fi
            
            echo "🔧 Apply failed, clearing locks and retrying..."
            
            # Clear locks using multiple methods
            LOCK_TABLE="oyins-journey-terraform-locks"
            
            # Method 1: Clear all locks in the table (safe operation)
            aws dynamodb scan --table-name "$LOCK_TABLE" --region us-east-1 --query 'Items[].LockID.S' --output text | tr '\t' '\n' | while read -r lock_id; do
              if [ -n "$lock_id" ] && [ "$lock_id" != "None" ]; then
                aws dynamodb delete-item --table-name "$LOCK_TABLE" --key "{\"LockID\":{\"S\":\"$lock_id\"}}" --region us-east-1 2>/dev/null || true
              fi
            done
            
            # Method 2: Force unlock known problematic ID
            terraform force-unlock -force "95e59694-ed04-163e-b715-c11551303d08" 2>/dev/null || true
            
            echo "⏳ Waiting 10 seconds before retry..."
            sleep 10
          fi
        done
        
        # Store outputs in SSM Parameter Store for frontend workflow
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-api-url" --value "$(terraform output -raw api_gateway_url)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-bucket" --value "$(terraform output -raw s3_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-admin-bucket" --value "$(terraform output -raw s3_admin_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-frontend-id" --value "$(terraform output -raw cloudfront_frontend_id)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-admin-id" --value "$(terraform output -raw cloudfront_admin_id)" --type "String" --overwrite