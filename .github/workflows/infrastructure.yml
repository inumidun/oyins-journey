name: Infrastructure Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: oyins-journey
    
    outputs:
      s3-frontend-bucket: ${{ steps.terraform-apply.outputs.s3_bucket_name }}
      s3-admin-bucket: ${{ steps.terraform-apply.outputs.s3_admin_bucket_name }}
      cloudfront-frontend-url: ${{ steps.terraform-apply.outputs.cloudfront_frontend_url }}
      cloudfront-admin-url: ${{ steps.terraform-apply.outputs.cloudfront_admin_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.aws_region }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
        terraform_wrapper: false
    
    - name: Bootstrap backend (if needed)
      working-directory: ./infrastructure
      run: |
        aws s3api head-bucket --bucket oyins-journey-terraform-state >/dev/null 2>&1 || {
          echo "🚀 Creating Terraform backend..."
          chmod +x bootstrap.sh
          ./bootstrap.sh
        }
    
    - name: Terraform Init
      working-directory: ./infrastructure
      run: |
        ENV="${{ inputs.environment }}"
        terraform init -backend-config="key=infrastructure/${ENV}/terraform.tfstate"
    
    - name: Terraform Plan
      working-directory: ./infrastructure
      run: |
        # Function to handle terraform state locks
        handle_terraform_lock() {
          local cmd="$1"
          local max_retries=3
          local retry_count=0
          
          while [ $retry_count -lt $max_retries ]; do
            echo "Attempt $((retry_count + 1)) of $max_retries"
            
            if eval "$cmd"; then
              echo "✅ Terraform command succeeded"
              return 0
            else
              echo "❌ Terraform command failed"
              
              # Check if it's a lock error
              ERROR_OUTPUT=$(eval "$cmd" 2>&1)
              if echo "$ERROR_OUTPUT" | grep -q "Error acquiring the state lock"; then
                echo "🔒 State lock detected, attempting to unlock..."
                
                # Try multiple approaches to clear the lock
                echo "🔧 Attempting to clear lock using multiple methods..."
                
                # Method 1: Direct DynamoDB deletion
                LOCK_TABLE="oyins-journey-terraform-locks"
                STATE_PATH="oyins-journey-terraform-state/infrastructure/dev/terraform.tfstate"
                
                aws dynamodb delete-item \
                  --table-name "$LOCK_TABLE" \
                  --key "{\"LockID\":{\"S\":\"$STATE_PATH\"}}" \
                  --region us-east-1 2>/dev/null && echo "DynamoDB lock item deleted" || echo "DynamoDB deletion failed"
                
                # Method 2: Try with known problematic lock ID
                echo "Trying terraform force-unlock with known lock ID..."
                terraform force-unlock -force "95e59694-ed04-163e-b715-c11551303d08" 2>/dev/null && echo "Known lock ID unlocked" || echo "Known lock ID unlock failed"
                
                # Method 3: Try to extract lock ID from error and unlock
                LOCK_ID=$(echo "$ERROR_OUTPUT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1)
                if [ -n "$LOCK_ID" ] && [[ "$LOCK_ID" =~ ^[a-f0-9-]+$ ]]; then
                  echo "Extracted lock ID: $LOCK_ID, attempting unlock..."
                  terraform force-unlock -force "$LOCK_ID" 2>/dev/null && echo "Extracted lock ID unlocked" || echo "Extracted lock ID unlock failed"
                fi
                
                echo "🔓 Lock clearing attempts completed, retrying command..."
                retry_count=$((retry_count + 1))
                sleep 5
              else
                echo "Non-lock related error, failing..."
                echo "Error output: $ERROR_OUTPUT"
                return 1
              fi
            fi
          done
          
          echo "Max retries reached, failing..."
          return 1
        }
        
        # Run terraform plan with lock handling
        handle_terraform_lock "terraform plan -var-file=\"config/${{ inputs.environment }}.tfvars\" -out=tfplan"
    
    - name: Terraform Apply
      id: terraform-apply
      working-directory: ./infrastructure
      run: |
        # Function to handle terraform state locks (same as above)
        handle_terraform_lock() {
          local cmd="$1"
          local max_retries=3
          local retry_count=0
          
          while [ $retry_count -lt $max_retries ]; do
            echo "Attempt $((retry_count + 1)) of $max_retries"
            
            if eval "$cmd"; then
              echo "✅ Terraform command succeeded"
              return 0
            else
              echo "❌ Terraform command failed"
              
              # Check if it's a lock error
              ERROR_OUTPUT=$(eval "$cmd" 2>&1)
              if echo "$ERROR_OUTPUT" | grep -q "Error acquiring the state lock"; then
                echo "🔒 State lock detected, attempting to unlock..."
                
                # Try multiple approaches to clear the lock
                echo "🔧 Attempting to clear lock using multiple methods..."
                
                # Method 1: Direct DynamoDB deletion
                LOCK_TABLE="oyins-journey-terraform-locks"
                STATE_PATH="oyins-journey-terraform-state/infrastructure/dev/terraform.tfstate"
                
                aws dynamodb delete-item \
                  --table-name "$LOCK_TABLE" \
                  --key "{\"LockID\":{\"S\":\"$STATE_PATH\"}}" \
                  --region us-east-1 2>/dev/null && echo "DynamoDB lock item deleted" || echo "DynamoDB deletion failed"
                
                # Method 2: Try with known problematic lock ID
                echo "Trying terraform force-unlock with known lock ID..."
                terraform force-unlock -force "95e59694-ed04-163e-b715-c11551303d08" 2>/dev/null && echo "Known lock ID unlocked" || echo "Known lock ID unlock failed"
                
                # Method 3: Try to extract lock ID from error and unlock
                LOCK_ID=$(echo "$ERROR_OUTPUT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1)
                if [ -n "$LOCK_ID" ] && [[ "$LOCK_ID" =~ ^[a-f0-9-]+$ ]]; then
                  echo "Extracted lock ID: $LOCK_ID, attempting unlock..."
                  terraform force-unlock -force "$LOCK_ID" 2>/dev/null && echo "Extracted lock ID unlocked" || echo "Extracted lock ID unlock failed"
                fi
                
                echo "🔓 Lock clearing attempts completed, retrying command..."
                retry_count=$((retry_count + 1))
                sleep 5
              else
                echo "Non-lock related error, failing..."
                echo "Error output: $ERROR_OUTPUT"
                return 1
              fi
            fi
          done
          
          echo "Max retries reached, failing..."
          return 1
        }
        
        # Run terraform apply with lock handling
        handle_terraform_lock "terraform apply -auto-approve tfplan"
        
        # Store outputs in SSM Parameter Store for frontend workflow
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-api-url" --value "$(terraform output -raw api_gateway_url)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-bucket" --value "$(terraform output -raw s3_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-admin-bucket" --value "$(terraform output -raw s3_admin_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-frontend-id" --value "$(terraform output -raw cloudfront_frontend_id)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-admin-id" --value "$(terraform output -raw cloudfront_admin_id)" --type "String" --overwrite
        
        # Store outputs in SSM Parameter Store for frontend workflow
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-api-url" --value "$(terraform output -raw api_gateway_url)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-bucket" --value "$(terraform output -raw s3_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-admin-bucket" --value "$(terraform output -raw s3_admin_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-frontend-id" --value "$(terraform output -raw cloudfront_frontend_id)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-admin-id" --value "$(terraform output -raw cloudfront_admin_id)" --type "String" --overwrite