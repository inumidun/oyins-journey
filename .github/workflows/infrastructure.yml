name: Infrastructure Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: oyins-journey
    
    outputs:
      s3-frontend-bucket: ${{ steps.terraform-apply.outputs.s3_bucket_name }}
      s3-admin-bucket: ${{ steps.terraform-apply.outputs.s3_admin_bucket_name }}
      cloudfront-frontend-url: ${{ steps.terraform-apply.outputs.cloudfront_frontend_url }}
      cloudfront-admin-url: ${{ steps.terraform-apply.outputs.cloudfront_admin_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.aws_region }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
        terraform_wrapper: false
    
    - name: Bootstrap backend (if needed)
      working-directory: ./infrastructure
      run: |
        aws s3api head-bucket --bucket oyins-journey-terraform-state >/dev/null 2>&1 || {
          echo "🚀 Creating Terraform backend..."
          chmod +x bootstrap.sh
          ./bootstrap.sh
        }
    
    - name: Terraform Init
      working-directory: ./infrastructure
      run: |
        ENV="${{ inputs.environment }}"
        terraform init -backend-config="key=infrastructure/${ENV}/terraform.tfstate"
        
        # Check for existing locks and clear them if they're stale
        echo "🔍 Checking for stale locks..."
        LOCK_ERROR=$(terraform plan -var-file="config/${ENV}.tfvars" 2>&1)
        
        if echo "$LOCK_ERROR" | grep -q "Error acquiring the state lock"; then
          echo "🔒 Found stale lock, attempting to clear it..."
          
          # Debug: Show the actual error output format
          echo "Lock error output:"
          echo "$LOCK_ERROR" | grep -A 15 "Lock Info:"
          
          # Extract lock ID using multiple methods
          # Method 1: Look for ID field in Lock Info section
          STALE_LOCK_ID=$(echo "$LOCK_ERROR" | grep -A 15 "Lock Info:" | grep "ID:" | sed 's/.*ID:[[:space:]]*//' | sed 's/[[:space:]]*$//' | head -1)
          
          # Method 2: If method 1 fails, try direct UUID pattern matching
          if [ -z "$STALE_LOCK_ID" ] || [ "$STALE_LOCK_ID" = "" ]; then
            STALE_LOCK_ID=$(echo "$LOCK_ERROR" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1)
          fi
          
          # Method 3: Try the known problematic lock ID as fallback
          if [ -z "$STALE_LOCK_ID" ] || [ "$STALE_LOCK_ID" = "" ]; then
            echo "Could not extract lock ID, trying known problematic lock ID..."
            STALE_LOCK_ID="95e59694-ed04-163e-b715-c11551303d08"
          fi
          
          if [ -n "$STALE_LOCK_ID" ] && [[ "$STALE_LOCK_ID" =~ ^[a-f0-9-]+$ ]]; then
            echo "🔓 Clearing stale lock: $STALE_LOCK_ID"
            
            # Try direct DynamoDB deletion first
            echo "🔧 Attempting to clear lock using AWS CLI..."
            LOCK_TABLE="oyins-journey-terraform-locks"
            STATE_PATH="oyins-journey-terraform-state/infrastructure/${ENV}/terraform.tfstate"
            
            aws dynamodb delete-item \
              --table-name "$LOCK_TABLE" \
              --key "{\"LockID\":{\"S\":\"$STATE_PATH\"}}" \
              --region us-east-1 2>/dev/null && echo "DynamoDB lock item deleted" || echo "DynamoDB deletion failed or item not found"
            
            # Then try terraform force-unlock
            terraform force-unlock -force "$STALE_LOCK_ID"
            
            if [ $? -eq 0 ]; then
              echo "✅ Stale lock cleared successfully"
            else
              echo "❌ Failed to clear stale lock with terraform force-unlock"
              # Don't exit here, let the retry logic handle it
            fi
          else
            echo "❌ Could not extract valid lock ID"
            echo "Extracted value: '$STALE_LOCK_ID'"
            echo "Full error output:"
            echo "$LOCK_ERROR"
            # Don't exit here, let the retry logic handle it
          fi
        else
          echo "✅ No stale locks found"
        fi
    
    - name: Terraform Plan
      working-directory: ./infrastructure
      run: |
        # Function to handle terraform state locks
        handle_terraform_lock() {
          local cmd="$1"
          local max_retries=3
          local retry_count=0
          
          while [ $retry_count -lt $max_retries ]; do
            echo "Attempt $((retry_count + 1)) of $max_retries"
            
            if eval "$cmd"; then
              echo "✅ Terraform command succeeded"
              return 0
            else
              echo "❌ Terraform command failed"
              
              # Check if it's a lock error
              ERROR_OUTPUT=$(eval "$cmd" 2>&1)
              if echo "$ERROR_OUTPUT" | grep -q "Error acquiring the state lock"; then
                echo "🔒 State lock detected, attempting to unlock..."
                
                # Extract lock ID using multiple methods
                # Method 1: Look for ID field in Lock Info section
                LOCK_ID=$(echo "$ERROR_OUTPUT" | grep -A 15 "Lock Info:" | grep "ID:" | sed 's/.*ID:[[:space:]]*//' | sed 's/[[:space:]]*$//' | head -1)
                
                # Method 2: If method 1 fails, try direct UUID pattern matching
                if [ -z "$LOCK_ID" ] || [ "$LOCK_ID" = "" ]; then
                  LOCK_ID=$(echo "$ERROR_OUTPUT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1)
                fi
                
                # Method 3: Try the known problematic lock ID as fallback
                if [ -z "$LOCK_ID" ] || [ "$LOCK_ID" = "" ]; then
                  echo "Could not extract lock ID, trying known problematic lock ID..."
                  LOCK_ID="95e59694-ed04-163e-b715-c11551303d08"
                fi
                
                if [ -n "$LOCK_ID" ] && [[ "$LOCK_ID" =~ ^[a-f0-9-]+$ ]]; then
                  echo "Found lock ID: $LOCK_ID"
                  
                  # Try direct DynamoDB approach first
                  echo "🔧 Attempting to clear lock using AWS CLI..."
                  LOCK_TABLE="oyins-journey-terraform-locks"
                  STATE_PATH="oyins-journey-terraform-state/infrastructure/dev/terraform.tfstate"
                  
                  aws dynamodb delete-item \
                    --table-name "$LOCK_TABLE" \
                    --key "{\"LockID\":{\"S\":\"$STATE_PATH\"}}" \
                    --region us-east-1 2>/dev/null || echo "DynamoDB deletion failed or item not found"
                  
                  # Then try terraform force-unlock
                  terraform force-unlock -force "$LOCK_ID" 2>/dev/null || echo "Terraform force-unlock failed"
                  
                  echo "🔓 Lock clearing attempted, retrying..."
                  retry_count=$((retry_count + 1))
                  sleep 5
                else
                  echo "Could not extract or use valid lock ID"
                  return 1
                fi
              else
                echo "Non-lock related error, failing..."
                return 1
              fi
            fi
          done
          
          echo "Max retries reached, failing..."
          return 1
        }
        
        # Run terraform plan with lock handling
        handle_terraform_lock "terraform plan -var-file=\"config/${{ inputs.environment }}.tfvars\" -out=tfplan"
    
    - name: Terraform Apply
      id: terraform-apply
      working-directory: ./infrastructure
      run: |
        # Function to handle terraform state locks (same as above)
        handle_terraform_lock() {
          local cmd="$1"
          local max_retries=3
          local retry_count=0
          
          while [ $retry_count -lt $max_retries ]; do
            echo "Attempt $((retry_count + 1)) of $max_retries"
            
            if eval "$cmd"; then
              echo "✅ Terraform command succeeded"
              return 0
            else
              echo "❌ Terraform command failed"
              
              # Check if it's a lock error
              ERROR_OUTPUT=$(eval "$cmd" 2>&1)
              if echo "$ERROR_OUTPUT" | grep -q "Error acquiring the state lock"; then
                echo "🔒 State lock detected, attempting to unlock..."
                
                # Extract lock ID using multiple methods
                # Method 1: Look for ID field in Lock Info section
                LOCK_ID=$(echo "$ERROR_OUTPUT" | grep -A 15 "Lock Info:" | grep "ID:" | sed 's/.*ID:[[:space:]]*//' | sed 's/[[:space:]]*$//' | head -1)
                
                # Method 2: If method 1 fails, try direct UUID pattern matching
                if [ -z "$LOCK_ID" ] || [ "$LOCK_ID" = "" ]; then
                  LOCK_ID=$(echo "$ERROR_OUTPUT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1)
                fi
                
                # Method 3: Try the known problematic lock ID as fallback
                if [ -z "$LOCK_ID" ] || [ "$LOCK_ID" = "" ]; then
                  echo "Could not extract lock ID, trying known problematic lock ID..."
                  LOCK_ID="95e59694-ed04-163e-b715-c11551303d08"
                fi
                
                if [ -n "$LOCK_ID" ] && [[ "$LOCK_ID" =~ ^[a-f0-9-]+$ ]]; then
                  echo "Found lock ID: $LOCK_ID"
                  
                  # Try direct DynamoDB approach first
                  echo "🔧 Attempting to clear lock using AWS CLI..."
                  LOCK_TABLE="oyins-journey-terraform-locks"
                  STATE_PATH="oyins-journey-terraform-state/infrastructure/dev/terraform.tfstate"
                  
                  aws dynamodb delete-item \
                    --table-name "$LOCK_TABLE" \
                    --key "{\"LockID\":{\"S\":\"$STATE_PATH\"}}" \
                    --region us-east-1 2>/dev/null || echo "DynamoDB deletion failed or item not found"
                  
                  # Then try terraform force-unlock
                  terraform force-unlock -force "$LOCK_ID" 2>/dev/null || echo "Terraform force-unlock failed"
                  
                  echo "🔓 Lock clearing attempted, retrying..."
                  retry_count=$((retry_count + 1))
                  sleep 5
                else
                  echo "Could not extract or use valid lock ID"
                  return 1
                fi
              else
                echo "Non-lock related error, failing..."
                return 1
              fi
            fi
          done
          
          echo "Max retries reached, failing..."
          return 1
        }
        
        # Run terraform apply with lock handling
        handle_terraform_lock "terraform apply -auto-approve tfplan"
        
        # Store outputs in SSM Parameter Store for frontend workflow
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-api-url" --value "$(terraform output -raw api_gateway_url)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-bucket" --value "$(terraform output -raw s3_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-admin-bucket" --value "$(terraform output -raw s3_admin_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-frontend-id" --value "$(terraform output -raw cloudfront_frontend_id)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-admin-id" --value "$(terraform output -raw cloudfront_admin_id)" --type "String" --overwrite
        
        # Store outputs in SSM Parameter Store for frontend workflow
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-api-url" --value "$(terraform output -raw api_gateway_url)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-bucket" --value "$(terraform output -raw s3_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-s3-admin-bucket" --value "$(terraform output -raw s3_admin_bucket_name)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-frontend-id" --value "$(terraform output -raw cloudfront_frontend_id)" --type "String" --overwrite
        aws ssm put-parameter --name "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-cloudfront-admin-id" --value "$(terraform output -raw cloudfront_admin_id)" --type "String" --overwrite