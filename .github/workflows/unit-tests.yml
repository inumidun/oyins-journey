name: Unit Tests

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run security scan
      run: |
        echo "🔒 Running security scans..."
        # Add tools like Snyk, Bandit for Python, etc.
        
  test-python:
    runs-on: ubuntu-latest
    needs: [security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
        pip install pytest boto3 "moto[dynamodb,cloudwatch]>=4.2.0" pytest-cov hypothesis
    
    - name: Set AWS region for tests
      run: |
        echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV
        echo "AWS_ACCESS_KEY_ID=testing" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=testing" >> $GITHUB_ENV
    
    - name: Run Python tests with coverage
      run: |
        echo "🧪 Running Python tests for ${{ inputs.environment }}..."
        # Run pytest with coverage for all test files
        pytest tests/ -v --cov=api --cov=scripts --cov-report=xml --cov-report=term-missing
        
        # Run specific test categories
        echo "Running API tests..."
        pytest tests/test_api_*.py -v
        
        echo "Running script tests..."
        pytest tests/test_scripts_*.py -v
        
        echo "Running property-based tests..."
        pytest tests/test_*_properties*.py -v
    
    - name: Upload coverage reports
      # uses: codecov/codecov-action@v3
      run: echo "Coverage reports would be uploaded"

  test-frontend:
    runs-on: ubuntu-latest
    needs: [security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Run frontend tests
      working-directory: frontend
      run: |
        echo "🧪 Running frontend tests for ${{ inputs.environment }}..."
        npm run test
    
    - name: Run TypeScript type checking
      working-directory: frontend
      run: |
        echo "🔍 Running TypeScript type checking..."
        npx tsc --noEmit
    
    - name: Build frontend
      working-directory: frontend
      run: |
        echo "🏗️ Building frontend..."
        npm run build
  
  lint-code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort bandit
    
    - name: Lint Python code
      run: |
        echo "🧩 Linting code..."
        # Security linting
        bandit -r api/ -f json -o bandit-report.json || true
        # Code style
        flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check api/ || echo "Code formatting issues found"
        isort --check-only api/ || echo "Import sorting issues found"
        
        # Lint scripts directory
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        black --check scripts/ || echo "Script formatting issues found"