name: Unit Tests

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run security scan
      run: |
        echo "🔒 Running security scans..."
        # Add tools like Snyk, Bandit for Python, etc.
        
  test-python:
    runs-on: ubuntu-latest
    needs: [security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest boto3 moto pytest-cov
    
    - name: Run Python tests with coverage
      run: |
        echo "🧪 Running Python tests for ${{ inputs.environment }}..."
        # pytest api/tests/ -v --cov=api --cov-report=xml
        echo "Tests would run here"
    
    - name: Upload coverage reports
      # uses: codecov/codecov-action@v3
      run: echo "Coverage reports would be uploaded"
  
  lint-code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort bandit
    
    - name: Lint Python code
      run: |
        echo "🧩 Linting code..."
        # Security linting
        bandit -r api/ -f json -o bandit-report.json || true
        # Code style
        flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check api/ || echo "Code formatting issues found"
        isort --check-only api/ || echo "Import sorting issues found"