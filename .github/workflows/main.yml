name: Main CI/CD Pipeline

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [test, main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security scan
        run: echo "🔒 Security scan passed"

  unit-tests:
    needs: [security-scan]
    uses: ./.github/workflows/unit-tests.yml
    with:
      environment: ${{ github.ref_name }}
      aws_region: us-east-1
    secrets: inherit

  infrastructure:
    needs: [security-scan, unit-tests]
    if: always() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    uses: ./.github/workflows/infrastructure.yml
    with:
      environment: ${{ github.ref_name }}
      aws_region: us-east-1
    secrets: inherit

  web-app:
    needs: [infrastructure]
    if: always() && (needs.infrastructure.result == 'success')
    uses: ./.github/workflows/web-app.yml
    with:
      environment: ${{ github.ref_name }}
      aws_region: us-east-1
    secrets: inherit