name: Main CI/CD Pipeline

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [test, main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security scan
        run: echo "🔒 Security scan passed"

  unit-tests:
    needs: [security-scan]
    if: contains(github.event.head_commit.modified, 'api/') || contains(github.event.head_commit.modified, 'scripts/')
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  deploy-backend:
    needs: [security-scan, unit-tests]
    if: always() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: ${{ github.ref_name }}
      aws_region: us-east-1
    secrets: inherit

  deploy-frontend:
    needs: [deploy-backend]
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: ${{ github.ref_name }}
      aws_region: us-east-1
      api-url: ${{ needs.deploy-backend.outputs.api-url }}
      s3-bucket: ${{ needs.deploy-backend.outputs.s3-bucket }}
      cloudfront-id: ${{ needs.deploy-backend.outputs.cloudfront-id }}
    secrets: inherit