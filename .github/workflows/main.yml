name: Main CI/CD Pipeline

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [test, main]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      aws_region: ${{ steps.set-env.outputs.aws_region }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set environment variables
        id: set-env
        run: |
          if [[ $GITHUB_REF == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == "refs/heads/dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=test" >> $GITHUB_OUTPUT
          fi
          echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
      
      - name: Security scan
        run: echo "🔒 Security scan passed"

  unit-tests:
    needs: [setup]
    uses: ./.github/workflows/unit-tests.yml
    with:
      environment: ${{ needs.setup.outputs.environment }}
      aws-region: ${{ needs.setup.outputs.aws_region }}
    secrets: inherit

  infrastructure:
    needs: [setup, unit-tests]
    if: always() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    uses: ./.github/workflows/infrastructure.yml
    with:
      environment: ${{ needs.setup.outputs.environment }}
      aws-region: ${{ needs.setup.outputs.aws_region }}
    secrets: inherit

  web-app:
    needs: [infrastructure]
    if: always() && (needs.infrastructure.result == 'success')
    uses: ./.github/workflows/web-app.yml
    with:
      environment: ${{ needs.setup.outputs.environment }}
      aws-region: ${{ needs.setup.outputs.aws_region }}
      api_url: ${{ needs.infrastructure.outputs.api_url }}
      frontend_bucket: ${{ needs.infrastructure.outputs.s3-frontend-bucket }}
      admin_bucket: ${{ needs.infrastructure.outputs.s3-admin-bucket }}
      cloudfront_frontend_id: ${{ needs.infrastructure.outputs.cloudfront_frontend_id }}
      cloudfront_admin_id: ${{ needs.infrastructure.outputs.cloudfront_admin_id }}
    secrets: inherit